name: Bug Report
description: Report a bug or unexpected behavior in Karaoke Rehearsal Lounge or LetsVibe Code Auditor on Anna
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: app
    attributes:
      label: Which Anna App?
      options:
        - Karaoke Rehearsal Lounge
        - LetsVibe Code Auditor
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: "e.g. v1.0.10 or v0.2.49"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment (Anna Cloud / Local / Browser / OS)
      placeholder: "e.g. Anna Desktop / Firefox on Linux"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Steps to reproduce and any error message shown.
    validations:
      required: true
